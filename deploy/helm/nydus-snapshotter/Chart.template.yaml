apiVersion: v2
name: nydus-snapshotter
description: >-
  Rust nydus v3 containerd remote snapshotter (single binary containerd-nydus) with
  fanotify/EROFS on-demand mounting, FUSE fallback, and node-local zran acceleration.
  Deploys a privileged DaemonSet; does NOT edit host containerd config by default.
type: application
keywords:
  - containerd
  - snapshotter
  - nydus
  - erofs
  - fanotify
  - lazy-pulling
home: https://github.com/PKizzle/nydus
sources:
  - https://github.com/PKizzle/nydus
maintainers:
  - name: pkizzle
    url: https://github.com/PKizzle
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: storage
  artifacthub.io/prerelease: "{{IS_PRERELEASE}}"

# The version and appVersion fields are set automatically by the release workflow
# (.github/workflows/helm-release.yml) from the release tag.
version: 0.0.0
appVersion: "v0.0.0"
