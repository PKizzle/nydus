[package]
name = "cyper-core"
version = "0.9.0"
description = "Core adaptors and services for compio running on hyper"
categories = ["asynchronous", "network-programming"]
keywords = ["async", "net"]
readme = "README.md"
# De-workspaced from the cyper git workspace so this crate can be used as a
# local [patch] override (see ../../Cargo.toml). Values mirror cyper's
# [workspace.package]/[workspace.dependencies] at rev d1c8aff.
edition = "2024"
license = "MIT"
repository = "https://github.com/compio-rs/cyper"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
compio = { version = "0.19.1", default-features = false, features = [
    "io",
    "time",
    "tls",
] }

futures-util = "0.3.32"
hyper = "1.10.1"
send_wrapper = { version = "0.6.0", features = ["futures"] }

[features]
default = []

nightly = ["compio/nightly"]
