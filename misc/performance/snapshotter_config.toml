# Unified TOML configuration for the Rust nydus snapshotter (containerd-nydus).
#
# This replaces the legacy Go containerd-nydus-grpc two-file model (a snapshotter
# TOML plus a separate nydusd JSON). The Rust snapshotter links nydus-service and
# runs the daemon in-process, so the per-image nydusd backend/cache config is
# generated programmatically (see snapshotter/src/daemon/config_builder.rs) from
# the sections below plus the image reference.

[snapshotter]
# Snapshotter home directory.
root = "/var/lib/containerd/io.containerd.snapshotter.v1.nydus"
# gRPC proxy-plugin socket containerd connects to (see misc/performance/containerd_config.toml).
address = "/run/containerd-nydus/containerd-nydus-grpc.sock"
cleanup_on_close = false
# Rank fs drivers by preference, probe, and pick the first available one.
fs_driver_policy = "auto"

[snapshotter.daemon]
# How to handle daemon death: "none", "restart" or "failover" (takeover test flips this to failover).
recover_policy = "restart"
threads = 4
log_level = "info"

[snapshotter.cache]
work_dir = "/var/lib/containerd/io.containerd.snapshotter.v1.nydus/cache"

[snapshotter.features]
referrer_detect = false
prefetch = false
metrics = true

# GitHub runner kernels are < 6.14, so fanotify (FAN_CLASS_PRE_CONTENT) is unavailable;
# pin fusedev as the only candidate so the probe deterministically selects it.
[[snapshotter.fs_drivers]]
type = "fusedev"

# The smoke test registry (localhost:5077, started via `docker run registry:2`) is plain HTTP
# with no TLS, so the in-process daemon must pull blobs over HTTP and skip TLS verification.
[backends.registry]
plain_http = true
skip_verify = true
