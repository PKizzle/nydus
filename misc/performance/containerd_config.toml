version = 2
root = "/var/lib/containerd"
state = "/run/containerd"
oom_score = 0

# containerd v2 enables the Transfer service by default, but it does not propagate the
# remote-snapshot annotations (notably the image ref) that a proxy snapshotter needs: pulling
# with `--snapshotter nydus` first fails with "no unpack platforms defined" and then, once that is
# worked around, with "failed to find image ref of snapshot" (still-open containerd issue #11606).
# Disable the Transfer service so nerdctl/ctr fall back to the legacy client-side pull path, which
# sets the remote-snapshot labels (with proxy_plugins.nydus.exports below). This is the global
# equivalent of `ctr --local`.
disabled_plugins = ["io.containerd.transfer.v1.local"]

[debug]
  level = "debug"

[plugins."io.containerd.grpc.v1.cri".containerd]
  snapshotter = "nydus"
  disable_snapshot_annotations = false
  discard_unpacked_layers = false

[proxy_plugins]
  [proxy_plugins.nydus]
      type = "snapshot"
      address = "/run/containerd-nydus/containerd-nydus-grpc.sock"
      # Required for the zran / lazy-pulling (remote snapshot) path.
      [proxy_plugins.nydus.exports]
        enable_remote_snapshot_annotations = "true"
