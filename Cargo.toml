[package]
name = "nydus-rs"
# will be overridden by real git tag during cargo build
version = "0.0.0-git"
description = "Nydus Image Service"
authors = ["The Nydus Developers"]
license = "Apache-2.0 OR BSD-3-Clause"
homepage = "https://nydus.dev/"
repository = "https://github.com/dragonflyoss/nydus"
exclude = ["contrib/", "smoke/", "tests/"]
edition = "2024"
# Inherited from [workspace.package] so every member declares the same MSRV --
# see the note there for why it tracks the pinned toolchain.
rust-version.workspace = true
build = "build.rs"

[profile.release]
panic = "abort"

[profile.dev]
opt-level = 1
debug = true

[[bin]]
name = "nydusctl"
path = "src/bin/nydusctl/main.rs"

[[bin]]
name = "nydusd"
path = "src/bin/nydusd/main.rs"

[[bin]]
name = "nydus-image"
path = "src/bin/nydus-image/main.rs"

[lib]
name = "nydus"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive", "cargo"] }
flexi_logger = { version = "0.31.9", features = ["compress"] }
fuse-backend-rs = { workspace = true }
hex = "0.4.3"
# `nydusctl` speaks HTTP/1 to the daemon's unix socket over compio, using hyper's
# low-level client — the same tokio-free pattern as nydus-storage's http-proxy
# backend. Deliberately NOT hyper-util/hyperlocal: both are tokio-bound, and the
# workspace runs on compio (see CLAUDE.md).
# The driver features are named explicitly rather than inherited from nydus-storage:
# a `--bin nydusctl` build must stand on its own, since relying on feature unification
# is what let the tokio dependency hide here in the first place.
compio = { version = "0.19", default-features = false, features = [
    "runtime",
    "time",
    "io-uring",
    "polling",
    "net",
    "macros",
] }
cyper-core = { version = "0.9", default-features = false }
hyper = { version = "1.10.1", features = ["client", "http1"] }
http-body-util = "0.1.4"
libc = "0.2.186"
log = "0.4.33"
log-panics = { version = "2.1.0", features = ["with-backtrace"] }
# Global allocator for the nydusd / nydus-image binaries (see their main.rs):
# compio's owned-buffer completion I/O churns small allocations; mimalloc's
# thread-local pools cut the overhead. Pure C, builds on musl-static.
mimalloc = "0.1.52"
mio = { version = "1.2.2", features = ["os-poll", "os-ext"] }
nix = { version = "0.31.3", features = ["process", "signal", "user"] }
rlimit = "0.11.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["serde_derive", "rc"] }
serde_json = "1.0.150"
tar = "0.4.46"

nydus-api = { version = "0.5.0", path = "api", features = [
    "error-backtrace",
    "handler",
] }
nydus-builder = { version = "0.2.0", path = "builder" }
nydus-rafs = { version = "0.4.1", path = "rafs" }
nydus-service = { version = "0.4.0", path = "service", features = [
    "block-device",
] }
nydus-storage = { version = "0.7.2", path = "storage" }
nydus-utils = { version = "0.6.0", path = "utils" }

vhost = { workspace = true, features = ["vhost-user"], optional = true }
vhost-user-backend = { workspace = true, optional = true }
virtio-bindings = { workspace = true, optional = true }
virtio-queue = { workspace = true, optional = true }
vm-memory = { workspace = true, features = [
    "backend-mmap",
    "backend-atomic",
], optional = true }
vmm-sys-util = { workspace = true, optional = true }

[build-dependencies]
time = { version = "0.3.53", features = ["formatting"] }

[dev-dependencies]
xattr = "1.6.1"
vmm-sys-util = { workspace = true }

[features]
default = [
    "fuse-backend-rs/fusedev",
    "backend-registry",
    "backend-oss",
    "backend-s3",
    "backend-http-proxy",
    "backend-localdisk",
    "dedup",
]
virtiofs = [
    "nydus-service/virtiofs",
    "vhost",
    "vhost-user-backend",
    "virtio-bindings",
    "virtio-queue",
    "vm-memory",
    "vmm-sys-util",
]
block-nbd = ["nydus-service/block-nbd"]
block-uffd = ["nydus-service/block-uffd"]

backend-http-proxy = [
    "nydus-storage/backend-http-proxy",
]
backend-localdisk = [
    "nydus-storage/backend-localdisk",
    "nydus-storage/backend-localdisk-gpt",
]
backend-oss = ["nydus-storage/backend-oss"]
backend-registry = ["nydus-storage/backend-registry"]
backend-s3 = ["nydus-storage/backend-s3"]
# Opt-in only — NOT in `default`. Pulls the third-party dragonfly-client-request,
# which hardcodes native-tls (OpenSSL on Linux, which blocks the musl-static
# build) and spins up its own tokio runtime (the default build runs solely on
# compio). Enable explicitly on a glibc target when Dragonfly P2P is required.
backend-dragonfly-proxy = ["nydus-storage/backend-dragonfly-proxy"]

dedup = ["nydus-storage/dedup"]

[workspace]
# All members are edition 2024 (which implies the v3 resolver); set it explicitly
# at the workspace root so Cargo doesn't warn about ignoring members' resolvers.
resolver = "3"

members = [
    "api",
    "builder",
    "clib",
    "rafs",
    "registry-client",
    "snapshotter",
    "nydusify",
    "storage",
    "service",
    "upgrade",
    "utils",
]

[workspace.package]
# Tracks the toolchain pinned in rust-toolchain.toml, which is what every build
# of this repo actually uses. It was "1.85" (edition 2024's floor) until
# 2026-07, but that had long since stopped being true -- `time` and `darling`
# require 1.88 and fjall requires 1.90, so a 1.85 rustc failed anyway, pointing
# at a dependency instead of at us. Declaring it here rather than on the root
# package alone is what makes clippy's MSRV-aware lints work for every member;
# without it they run unconstrained and have to be silenced in the Makefile.
rust-version = "1.96"

[workspace.dependencies]
# rust-vmm crates
vhost = "0.16.0"
virtio-bindings = "0.2.7"
virtio-queue = "0.17.0"
vm-memory = "=0.17.1"
vmm-sys-util = "0.15.0"
vhost-user-backend = "0.22.0"

# fuse-backend-rs which depends on rust-vmm
fuse-backend-rs = "0.14.0"

[patch.crates-io]
# Local fix for a "prev exists" panic in compio-executor's task scheduler:
# its tick() iterates the hot-task linked list *live* while a polled task's
# wakers mutate that list (move/remove tasks), invalidating the cursor. The
# vendored copy (rebased onto upstream 0.1.3, which hardened the neighbour
# relinks but kept the live iteration) snapshots the hot ids before running
# them and tolerates a stale key in unlink()/take(). Required for the cyper
# HTTP backend (the panic triggers on HTTP connection teardown).
# NB: the vendored crate's `version` MUST track the version compio-runtime
# resolves to (currently 0.1.3), or cargo silently ignores this patch and
# ships the unfixed registry crate — check `cargo tree -i compio-executor`
# shows the path crate and Cargo.lock has no [[patch.unused]] entry for it.
# Upstream issue to be filed against compio-rs/compio. Drop trigger: upstream
# fixes the tick() cursor invalidation and releases compio-executor > 0.1.3
# with the fix; see docs/dependencies.md for filing/tracking status.
compio-executor = { path = "third_party/compio-executor" }

# Local patch adding `NoFreelistSync` support to bbolt-rs 1.3.10. Upstream gates
# `meta.free_list() == PGID_NO_FREE_LIST` with a hard error in `Bolt::new_db`,
# so it cannot open any bolt file produced by Go's bbolt with that option set —
# which is the default mode for containerd's metadata DB. The patch:
#   - rebuilds the freelist by scanning the page tree at open time (matching
#     Go bbolt's `db.freepages()` recovery path),
#   - skips the freelist-page commit and stamps PGID_NO_FREE_LIST in meta when
#     the new builder option `no_freelist_sync()` is set,
#   - exposes that setter on `BoltOptionsBuilder` (previously `setter(skip)`).
# `nydus-migrate reconcile-snapshots` depends on this to read containerd's
# `meta.db` in-process instead of shelling out to a Go helper.
# Upstream PR to be filed against ambaxter/bbolt-rs. Drop trigger: upstream
# merges NoFreelistSync support and releases bbolt-rs > 1.3.10 with it; see
# docs/dependencies.md for filing/tracking status.
bbolt-rs = { path = "third_party/bbolt-rs" }

# Local fix for a large-body read throughput regression in cyper-core's
# compio<->hyper stream adapter (patches the 0.9.0 release). compio drains the
# socket in 8 KiB chunks while hyper grows its read cursor toward ~400 KiB for
# large bodies; the upstream adapter zero-filled the *entire* cursor before
# every short read, so the memset scaled with the cursor, not the bytes read —
# a body-size-scaled overhead that plateaued large-body throughput ~35-40%
# below reqwest. The vendored copy reads in 256 KiB chunks and bounds the
# zero-fill window to match. The vendored `version` MUST track what the cyper
# 0.9.x workspace resolves (currently 0.9.0), or cargo silently demotes this
# patch to [[patch.unused]] — same trap as compio-executor above.
# Upstream PR to be filed against compio-rs/cyper. Drop trigger: upstream
# fixes the zero-fill window and cyper-core publishes a release at/after the
# fix commit; see docs/dependencies.md for filing/tracking status.
cyper-core = { path = "third_party/cyper-core" }
