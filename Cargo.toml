[package]
name = "nydus-rs"
# will be overridden by real git tag during cargo build
version = "0.0.0-git"
description = "Nydus Image Service"
authors = ["The Nydus Developers"]
license = "Apache-2.0 OR BSD-3-Clause"
homepage = "https://nydus.dev/"
repository = "https://github.com/dragonflyoss/nydus"
exclude = ["contrib/", "smoke/", "tests/"]
edition = "2024"
resolver = "3"
build = "build.rs"

[profile.release]
panic = "abort"

[profile.dev]
opt-level = 1
debug = true

[[bin]]
name = "nydusctl"
path = "src/bin/nydusctl/main.rs"

[[bin]]
name = "nydusd"
path = "src/bin/nydusd/main.rs"

[[bin]]
name = "nydus-image"
path = "src/bin/nydus-image/main.rs"

[lib]
name = "nydus"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6.1", features = ["derive", "cargo"] }
flexi_logger = { version = "0.31", features = ["compress"] }
fuse-backend-rs = { workspace = true }
hex = "0.4.3"
hyper = { version = "1.10.1", features = ["client"] }
hyperlocal = "0.9.1"
hyper-util = "0.1.20"
http-body-util = "0.1.3"
lazy_static = "1.5.0"
libc = "0.2.186"
log = "0.4.30"
log-panics = { version = "2.1.0", features = ["with-backtrace"] }
mio = { version = "1.2.1", features = ["os-poll", "os-ext"] }
nix = { version = "0.31.3", features = ["process", "signal", "user"] }
rlimit = "0.11.0"
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["serde_derive", "rc"] }
serde_json = "1.0.150"
tar = "0.4.46"
tokio = { version = "1.52.3", features = ["macros"] }

nydus-api = { version = "0.4.1", path = "api", features = [
    "error-backtrace",
    "handler",
] }
nydus-builder = { version = "0.2.0", path = "builder" }
nydus-rafs = { version = "0.4.1", path = "rafs" }
nydus-service = { version = "0.4.0", path = "service", features = [
    "block-device",
] }
nydus-storage = { version = "0.7.2", path = "storage" }
nydus-utils = { version = "0.5.1", path = "utils" }

vhost = { workspace = true, features = ["vhost-user"], optional = true }
vhost-user-backend = { workspace = true, optional = true }
virtio-bindings = { workspace = true, optional = true }
virtio-queue = { workspace = true, optional = true }
vm-memory = { workspace = true, features = [
    "backend-mmap",
    "backend-atomic",
], optional = true }
vmm-sys-util = { workspace = true, optional = true }

[build-dependencies]
time = { version = "0.3.47", features = ["formatting"] }

[target.'cfg(any(target_arch = "x86_64", target_arch = "aarch64"))'.dependencies]
nydus-storage = { version = "0.7.2", path = "storage", features = [
    "backend-dragonfly-proxy",
] }

[dev-dependencies]
xattr = "1.6.1"
vmm-sys-util = { workspace = true }

[features]
default = [
    "fuse-backend-rs/fusedev",
    "backend-registry",
    "backend-oss",
    "backend-s3",
    "backend-http-proxy",
    "backend-localdisk",
    "dedup",
]
virtiofs = [
    "nydus-service/virtiofs",
    "vhost",
    "vhost-user-backend",
    "virtio-bindings",
    "virtio-queue",
    "vm-memory",
    "vmm-sys-util",
]
block-nbd = ["nydus-service/block-nbd"]
block-uffd = ["nydus-service/block-uffd"]

backend-http-proxy = [
    "nydus-storage/backend-http-proxy",
]
backend-localdisk = [
    "nydus-storage/backend-localdisk",
    "nydus-storage/backend-localdisk-gpt",
]
backend-oss = ["nydus-storage/backend-oss"]
backend-registry = ["nydus-storage/backend-registry"]
backend-s3 = ["nydus-storage/backend-s3"]

dedup = ["nydus-storage/dedup"]

[workspace]
members = [
    "api",
    "builder",
    "clib",
    "rafs",
    "snapshotter",
    "nydusify",
    "storage",
    "service",
    "upgrade",
    "utils",
]

[workspace.dependencies]
# rust-vmm crates
vhost = "0.16.0"
virtio-bindings = "0.2.7"
virtio-queue = "0.17.0"
vm-memory = "=0.17.1"
vmm-sys-util = "0.15.0"
vhost-user-backend = "0.22.0"

# fuse-backend-rs which depends on rust-vmm
fuse-backend-rs = "0.14.0"

[patch.crates-io]
# Local fix for a "prev exists" panic in compio-executor 0.1.0's task scheduler:
# its tick() iterates the hot-task linked list *live* while a polled task's
# wakers mutate that list (move/remove tasks), invalidating the cursor. The
# vendored copy snapshots the hot ids before running them. Required for the
# cyper HTTP backend (the panic triggers on HTTP connection teardown).
# Upstream issue to be filed against compio-rs/compio.
compio-executor = { path = "third_party/compio-executor" }

# Local fix for a large-body read throughput regression in cyper-core's
# compio<->hyper stream adapter (rev d1c8aff). compio drains the socket in 8 KiB
# chunks while hyper grows its read cursor toward ~400 KiB for large bodies; the
# upstream adapter zero-filled the *entire* cursor before every short read, so
# the memset scaled with the cursor, not the bytes read — a body-size-scaled
# overhead that plateaued large-body throughput ~35-40% below reqwest. The
# vendored copy reads in 256 KiB chunks and bounds the zero-fill window to match.
# Upstream PR to be filed against compio-rs/cyper.
[patch."https://github.com/compio-rs/cyper"]
cyper-core = { path = "third_party/cyper-core" }
