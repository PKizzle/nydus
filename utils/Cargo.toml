[package]
name = "nydus-utils"
version = "0.6.0"
description = "Utilities and helpers for Nydus Image Service"
authors = ["The Nydus Developers"]
license = "Apache-2.0 OR BSD-3-Clause"
homepage = "https://nydus.dev/"
repository = "https://github.com/dragonflyoss/nydus"
edition = "2024"
rust-version.workspace = true

[dependencies]
arc-swap = "1.9.2"
thiserror = "2.0.18"
blake3 = "1.8.5"
httpdate = "1.0.3"
libc = "0.2.186"
log = "0.4.33"
# NB: plain "1.11.1", not "1.11.1+lz4-1.10.0" — cargo ignores semver build
# metadata in requirements and warns about it on every invocation.
lz4-sys = "1.11.1"
lz4 = "1.28.1"
aes = { version = "0.9.1", optional = true }
aes-gcm = { version = "0.11.0", optional = true }
xts-mode = { version = "0.6.0", optional = true }
getrandom = { version = "0.4.3", optional = true }
serde = { version = ">=1.0.228", features = ["serde_derive", "rc"] }
serde_json = ">=1.0.150"
sha2 = "0.11.0"
# Runtime-agnostic notifier backing the mpmc channel (replaces tokio::sync).
event-listener = "5.4.1"
zstd = "0.13.3"
nix = { version = "0.31.3", features = ["uio"] }
crc = "3.4.0"
xxhash-rust = { version = "0.8.16", features = ["xxh3"] }

nydus-api = { version = "0.6.0", path = "../api" }

# libz-ng-sys doesn't compile on ppc64, and zlib-ng currently breaks test binary
# linking on linux/aarch64 in this workspace. Fall back to stock zlib-sys there.
[target.'cfg(any(target_arch = "powerpc64", all(target_os = "linux", target_arch = "aarch64")))'.dependencies]
libz-sys = { version = "1.1.29", features = ["stock-zlib"], default-features = false, optional = true }
flate2 = { version = "1.1.9", features = ["zlib"], default-features = false }
[target.'cfg(not(any(target_arch = "powerpc64", all(target_os = "linux", target_arch = "aarch64"))))'.dependencies]
libz-sys = { version = "1.1.29", features = ["zlib-ng"], default-features = false, optional = true }
flate2 = { version = "1.1.9", features = ["zlib-ng-compat"], default-features = false }

[dev-dependencies]
vmm-sys-util = { workspace = true }
tar = "0.4.46"
futures = "0.3.32"

[features]
zran = ["libz-sys"]
encryption = ["aes", "aes-gcm", "xts-mode", "getrandom"]

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "aarch64-apple-darwin"]
