[package]
name = "nydus-snapshotter"
# Product version: `containerd-nydus --version` and the helm chart's default
# appVersion read this. Keep it in lockstep with the release tag's
# major.minor (release.yml warns on mismatch); helm-release.yml stamps the
# actual chart version from the tag.
version = "3.0.0"
description = "Containerd remote snapshotter for Nydus image service (Rust rewrite)"
authors = ["The Nydus Developers"]
license = "Apache-2.0 OR BSD-3-Clause"
homepage = "https://nydus.dev/"
repository = "https://github.com/dragonflyoss/nydus"
edition = "2024"
rust-version.workspace = true

[[bin]]
name = "containerd-nydus"
path = "src/bin/containerd-nydus.rs"

[[bin]]
name = "nydus-migrate"
path = "src/bin/nydus-migrate.rs"
# `migrate` is a default feature (see [features]); the gate remains so
# `--no-default-features` builds skip this tool along with its bbolt-rs dep.
required-features = ["migrate"]

[[bin]]
name = "nydus-credential-bridge"
path = "src/bin/nydus-credential-bridge.rs"

[[bin]]
name = "nydus-prefetchfiles-nri-plugin"
path = "src/bin/nydus-prefetchfiles-nri-plugin.rs"

[[bin]]
name = "nydus-optimizer-nri-plugin"
path = "src/bin/nydus-optimizer-nri-plugin.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "cargo", "env"] }
# Use the git version (not the crates.io 0.3.0): the published release is on
# tonic 0.9 / http 0.2, but main is on tonic 0.14 / http 1.0, which is required
# to serve the gRPC service over compio via cyper-axum (hyper 1.x / axum 0.8).
# Pinned to an unreleased containerd/rust-extensions `main` rev — there is no
# tagged release with tonic 0.14 yet. Drop trigger: watch for the next tagged
# rust-extensions release and move to a crates.io version req once it ships
# tonic >= 0.14; see docs/dependencies.md.
containerd-snapshots = { git = "https://github.com/containerd/rust-extensions", rev = "7c1f39a9cd0a1d7a2a61196ad3c2bddd996893b9" }
# compio runtime for the main snapshotter (containerd-nydus). The containerd
# snapshots gRPC service (a tonic tower-service) is served over a compio Unix
# socket via cyper-axum's hyper-http2 server (CompioExecutor) instead of tonic's
# tokio transport — see grpc/mod.rs. `ring` selects the rustls crypto provider
# for the cyper referrer client (matches nydus-storage).
compio = { version = "0.19", default-features = false, features = [
    "macros",
    "runtime",
    "net",
    "time",
    "process",
    "io-uring",
    "polling",
    "ring",
] }
# crates.io 0.9.0 targets compio 0.19 (released 2026-06-01), so the former
# master-commit git pin is gone; cyper-core still carries the local zero-fill
# patch via [patch.crates-io] in the workspace root.
cyper-axum = { version = "0.9", features = [
    "http2",
] }
# cyper HTTP client for the registry referrer-detection path (replaces reqwest;
# the rustls crypto provider is `ring`, via compio's `ring` feature above).
cyper = { version = "0.9", default-features = false, features = [
    "rustls",
    "json",
    "http2",
    "stream",
] }
# rustls for the auto-accel spegel mirror pull. The snapshotter trait
# requires `Send + Sync`, but cyper's `Client` holds an `Rc` internally
# (it targets the compio current_thread runtime), so the stored TLS
# material is `Arc<rustls::ClientConfig>` + the endpoint list (both
# Send + Sync) and the actual `cyper::Client` is built per call on a
# blocking thread driving its own thread-local compio runtime (see
# `peer_mirror.rs::block_on_http`). This matches the pattern
# `storage/src/backend/connection.rs` already uses for the registry
# backend, keeps reqwest+tokio out of the snapshotter, and avoids
# pulling OpenSSL. PEM cert/key loading goes through the re-exported
# `rustls::pki_types::pem::PemObject` ("std" enables pki-types/std) —
# NOT the archived rustls-pemfile wrapper (RUSTSEC-2025-0134).
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
# Platform verifier + extra PEM roots for the referrer client, so
# `[backends.registry].ca_cert_files` also covers referrer detection
# (not just the storage blob backend) on private-CA registries.
rustls-platform-verifier = "0.7"
http = "1.4"
axum = { version = "0.8.1", default-features = false }
async-lock = "3.4"
async-channel = "2.3"
blocking = "1.6"
futures = "0.3"
signal-hook = "0.3"
# The snapshotter's own event loop runs on compio; the ONE sanctioned tokio
# runtime is the isolated 2-worker runtime `content_store.rs` builds solely to
# drive the tonic *client* to containerd's Content/Images gRPC services (tonic's
# transport pins its futures to a tokio reactor). It is fully quarantined behind
# `blocking::unblock` + `handle.block_on` and shut down in `Drop`, so no tokio
# task ever touches a nydusd session thread. tokio is also pulled by the
# peripheral NRI plugin (ttrpc) and transitively by tonic/hyper-util for sync
# types. See ARCHITECTURE.md Decision 3 and CLAUDE.md gotcha #1 for the full
# rule and this exception.
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"
# Standard grpc.health.v1.Health service so containerd's proxy-plugin dialer and
# grpc_health_probe can check readiness. tonic-health is a runtime-agnostic tower
# service (tokio::sync primitives only, no runtime spawn), so it composes with the
# existing tonic::service::Routes and rides the same cyper-axum (hyper-on-compio)
# server as the Snapshots service — no tokio runtime, no second transport.
tonic-health = "0.14"
prost = "0.14"
prost-types = "0.14"
# UDS connector for the containerd Content gRPC client. tonic 0.14 transport
# needs a tower::Service<Uri> connector and an `Io` adapter; we drive both via
# `tower::service_fn` + `hyper_util::rt::TokioIo<tokio::net::UnixStream>`.
hyper-util = { version = "0.1", features = ["client-legacy"] }
tower = { version = "0.5", features = ["util"] }
# Global allocator for containerd-nydus (see its main.rs): compio owned-buffer
# completion I/O churns small allocations; mimalloc's thread-local pools help.
mimalloc = "0.1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = "1.1"
ttrpc = "0.9.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
fjall = "3.1.4"
# Used by the `nydus-migrate` legacy-import tool and the automatic startup
# migration in src/migrate.rs; optional behind the default-on `migrate` feature
# so a `--no-default-features` build can drop the legacy-import path entirely.
#
# `compat` is REQUIRED so bbolt-rs reads files written by Go's bbolt (the format
# the legacy Go nydus-snapshotter uses for `metadata.db`). Without it, bbolt-rs
# uses its own custom magic `0x5caff01d` instead of Go's `0xED0CDAED` and rejects
# every Go-written file with "invalid database - meta_can_read: true". The
# import tool exists solely to migrate those Go-written files into fjall, so
# compat is mandatory, not optional. See bbolt-rs/src/common/defaults.rs.
bbolt-rs = { version = "1.3.10", optional = true, features = ["compat"] }
thiserror = "2.0.18"
libc = "0.2"
mio = { version = "1.2", features = ["os-poll", "os-ext"] }
# Used by `access_tracer` for fanotify FAN_CLASS_NOTIF marks (auto-accel capture
# path). The pre-content read-serving path in `service/src/fanotify.rs` keeps
# its hand-rolled `fanotify_sys` because nix doesn't expose the pre-content
# constants; the capture path only needs the notify-class API which nix has.
# `hostname` is for spegel peer discovery's self-node filter
# (`nix::unistd::gethostname`).
nix = { version = "0.31", features = ["fanotify", "mount", "hostname"] }
# Glob-matching for the auto-accel capture exclude list.
glob = "0.3"
sendfd = "0.4.3"
sha2 = "0.11"
# sha2 0.11 returns a `Array` (renamed from GenericArray) which no longer
# implements `LowerHex`, so `format!("{:x}", hasher.finalize())` won't compile.
# `hex` formats the digest into a hex string and is the idiomatic replacement.
hex = "0.4"
# Used by `content_store` to look up the `k3s` / `ctr` binary at runtime.
which = "8"
# Used by `content_store::write_blob_from_data` for an O_CREAT|O_EXCL +
# random-suffix temp file, so we don't write through a pre-planted symlink
# in /tmp while the snapshotter runs as root.
tempfile = "3"

nydus-api = { version = "0.6.0", path = "../api" }
nydus-rafs = { version = "0.5.0", path = "../rafs" }
# OCI distribution client (bearer auth, referrers API) shared with nydusify.
# Drives the referrer-detection/materialization path in `source/referrer.rs`;
# its `RegistryClient` is `!Send` (cyper/compio), so it is constructed and used
# entirely inside the `blocking::unblock` + thread-local-runtime hops there.
registry-client = { path = "../registry-client" }
nydus-service = { version = "0.5.0", path = "../service", features = [
    "block-device",
] }
nydus-storage = { version = "0.8.0", path = "../storage" }
nydus-utils = { version = "0.6.0", path = "../utils" }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
# Drive a real tonic gRPC client (over tokio) against the compio cyper-axum
# server in the gRPC transport round-trip test.
tonic = { version = "0.14", features = ["transport"] }
tokio = { version = "1", features = ["rt", "macros"] }

[build-dependencies]
# Generates tonic 0.14 gRPC client bindings for containerd's Content service
# (proto vendored under snapshotter/proto/). The prost codegen split moved to
# `tonic-prost-build` in 0.14; matches `containerd-snapshots`' own build.rs.
tonic-prost-build = "0.14"

[features]
default = [
    "backend-registry",
    "backend-oss",
    "backend-s3",
    "backend-http-proxy",
    "backend-localdisk",
    "migrate",
]

backend-http-proxy = ["nydus-storage/backend-http-proxy"]
backend-localdisk = ["nydus-storage/backend-localdisk", "nydus-storage/backend-localdisk-gpt"]
backend-oss = ["nydus-storage/backend-oss"]
backend-registry = ["nydus-storage/backend-registry"]
backend-s3 = ["nydus-storage/backend-s3"]

# Legacy bbolt -> fjall migration: the `nydus-migrate` import tool plus the
# snapshotter's automatic startup import (src/migrate.rs). Default-on: the
# vendored bbolt-rs now pins `aligners` with `default-features = false`
# everywhere (it only uses `alignment::Page`, never SIMD), so bbolt-rs
# compiles on ppc64le/riscv64 too and no longer needs a per-arch gate.
migrate = ["dep:bbolt-rs"]
