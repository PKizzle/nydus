[package]
name = "nydusify"
version = "0.1.0"
description = "Rust rewrite of the Nydus image conversion utility"
authors = ["The Nydus Developers"]
license = "Apache-2.0 OR BSD-3-Clause"
homepage = "https://nydus.dev/"
repository = "https://github.com/dragonflyoss/nydus"
edition = "2024"

[[bin]]
name = "nydusify"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "cargo", "env"] }
# compio runtime: `macros` provides `#[compio::main]`, `runtime` the executor.
# The concrete io-uring/polling driver + ring crypto provider come transitively
# (feature-unified) from `registry-client`, which pins the exact compio rev.
compio = { version = "0.19", default-features = false, features = [
    "macros",
    "runtime",
    "time",
] }
registry-client = { path = "../registry-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Unix signal handling (SIGINT/SIGTERM) for the foreground `mount` subcommand,
# which supervises a nydusd child and unmounts on exit.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]