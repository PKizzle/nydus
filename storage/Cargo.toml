[package]
name = "nydus-storage"
version = "0.7.2"
description = "Storage subsystem for Nydus Image Service"
authors = ["The Nydus Developers"]
license = "Apache-2.0 OR BSD-3-Clause"
homepage = "https://nydus.dev/"
repository = "https://github.com/dragonflyoss/nydus"
edition = "2024"

[dependencies]
arc-swap = "1.5"
async-lock = "3.4"
async-trait = "0.1"
blocking = "1.6"
bytes = "1"
futures-util = { version = "0.3", default-features = false }
compio = { version = "0.19", default-features = false, features = [
    "runtime",
    "time",
    "io-uring",
    "polling",
] }
governor = "0.10"
base64 = { version = "0.22.1", optional = true }
bitflags = { version = "2.11.1", features = ["serde"] }
hex = "0.4.3"
hmac = { version = "0.13.0", optional = true }
http = { version = "1.4.0", optional = true }
httpdate = { version = "1.0", optional = true }
hyper = { version = "1.8.1", features = ["client"], optional = true }
hyperlocal = { version = "0.9.1", optional = true }
hyper-util = { version = "0.1.19", optional = true }
http-body-util = { version = "0.1.3", optional = true }
lazy_static = "1.4.0"
leaky-bucket = { version = "1.1.2" }
libc = "0.2"
log = "0.4.8"
nix = { version = "0.31.3", features = ["fs", "uio", "zerocopy"] }
reqwest = { version = "0.13.4", default-features = false, features = [
    "blocking",
    "charset",
    "form",
    "http2",
    "json",
    "query",
    "rustls",
], optional = true }
# Compio-native HTTP client replacing reqwest (cyper 0.9 tracks compio 0.19; the
# crates.io release still targets 0.18, so pin the master commit). default
# features drop native-tls so only rustls is pulled (musl-static goal).
cyper = { git = "https://github.com/compio-rs/cyper", rev = "d1c8aff18dd81c4b1f817d0e8e0e05408c15a04c", default-features = false, features = [
    "rustls",
    "http2",
    "hickory-dns",
    "stream",
], optional = true }
rusqlite = { version = "0.39.0", features = ["bundled"], optional = true }
r2d2 = { version = "0.8", optional = true }
r2d2_sqlite = { version = "0.34.0", optional = true }
serde = { version = "1.0.110", features = ["serde_derive", "rc"] }
serde_json = "1.0.53"
sha1 = { version = "0.11.0", optional = true }
sha2 = { version = "0.11.0", optional = true }
tar = "0.4.46"
time = { version = "0.3.47", features = ["formatting"], optional = true }
tokio = { version = "1.52.3", features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }
url = { version = "2.1.1", optional = true }
vm-memory = { workspace = true }
fuse-backend-rs = { workspace = true }
gpt = { version = "4.1.0", optional = true }

nydus-api = { version = "0.4.1", path = "../api" }
nydus-utils = { version = "0.5.1", path = "../utils", features = [
    "encryption",
    "zran",
] }
once_cell = { version = "1" }
dragonfly-client-util = { version = "1.3.3", optional = true }
rand = { version = "0.10" }

[dev-dependencies]
criterion = "0.5"
futures = "0.3"
http = "1.4.0"
hyper-util = { version = "0.1.19", features = ["server"] }
vmm-sys-util = { workspace = true }
tar = "0.4.46"
regex = "1.7.0"
toml = "1.1.2"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "time"] }

[[bench]]
name = "backend_read"
harness = false
required-features = ["backend-s3"]

[features]
backend-localdisk = []
backend-localdisk-gpt = ["gpt", "backend-localdisk"]
backend-localfs = []
backend-oss = ["base64", "cyper", "httpdate", "hmac", "sha1", "reqwest", "url"]
backend-registry = ["base64", "cyper", "reqwest", "url"]
backend-s3 = ["base64", "cyper", "hmac", "http", "reqwest", "sha2", "time", "url"]
backend-http-proxy = [
    "cyper",
    "hyper",
    "hyperlocal",
    "http",
    "hyper-util",
    "http-body-util",
    "reqwest",
    "url",
]
dedup = ["rusqlite", "r2d2", "r2d2_sqlite"]

backend-dragonfly-proxy = ["cyper", "dragonfly-client-util", "reqwest"]

[package.metadata.docs.rs]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]
