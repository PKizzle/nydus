[package]
name = "nydus-storage"
version = "0.7.2"
description = "Storage subsystem for Nydus Image Service"
authors = ["The Nydus Developers"]
license = "Apache-2.0 OR BSD-3-Clause"
homepage = "https://nydus.dev/"
repository = "https://github.com/dragonflyoss/nydus"
edition = "2024"

[dependencies]
arc-swap = "1.5"
async-lock = "3.4"
async-trait = "0.1"
blocking = "1.6"
bytes = "1"
futures-util = { version = "0.3", default-features = false }
compio = { version = "0.19", default-features = false, features = [
    "runtime",
    "time",
    "io-uring",
    "polling",
    "net",
    # Pin the rustls crypto provider to ring (-> compio-tls/ring -> rustls/ring).
    # reqwest used to bring a provider transitively; with reqwest dropped, rustls
    # needs exactly one provider selected or it panics at runtime ("could not
    # determine the process-level CryptoProvider"). ring is musl-static-friendly.
    "ring",
] }
governor = "0.10"
base64 = { version = "0.22.1", optional = true }
# rustls + platform verifier so `[backends.*].ca_cert_files` can extend the
# trust store on the cyper path (build_connection). Version-unified with the
# rustls cyper/compio re-export; ring matches the provider pinned above.
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
], optional = true }
rustls-platform-verifier = { version = "0.7", optional = true }
bitflags = { version = "2.11.1", features = ["serde"] }
hex = "0.4.3"
hmac = { version = "0.13.0", optional = true }
http = { version = "1.4.0", optional = true }
httpdate = { version = "1.0", optional = true }
hyper = { version = "1.8.1", features = ["client", "http1"], optional = true }
http-body-util = { version = "0.1.3", optional = true }
lazy_static = "1.4.0"
libc = "0.2"
log = "0.4.8"
nix = { version = "0.31.3", features = ["fs", "uio", "zerocopy"] }
# Compio-native HTTP client replacing reqwest (crates.io 0.9.0 targets compio
# 0.19). default features drop native-tls so only rustls is pulled
# (musl-static goal).
cyper = { version = "0.9", default-features = false, features = [
    "rustls",
    "http2",
    # HTTP/3 over QUIC is deliberately NOT enabled by default. With
    # `http3-altsvc`, a CDN advertising h3 via Alt-Svc (Docker Hub's
    # CloudFront does) silently upgrades the blob data path to QUIC — and
    # cyper's h3 pool has a wedge: the per-origin `connecting` marker is
    # removed only on the SUCCESS path (cyper/src/http3.rs Pool::connecting
    # vs new_connection), so one failed/hung QUIC handshake permanently
    # poisons the origin ("HTTP/3 connecting already in progress") and
    # concurrent requests during a legitimate connect error instead of
    # waiting. On the fanotify data path that turned every chunk read into
    # EIO (the 0.2.9-nydus mirrors incident). Opt back in via the
    # `backend-http3` feature once upstream is fixed
    # "cyper HTTP/3 pool wedge".
    "hickory-dns",
    "stream",
], optional = true }
# cyper-core provides the compio<->hyper stream adapter (`HyperStream`), reused
# by the http-proxy backend to speak HTTP/1 over a compio Unix socket. Pinned to
# the same rev as cyper and redirected to the local patched copy (see the
# workspace `[patch]`). Same drop trigger as cyper above, plus the vendored
# zero-fill fix landing upstream (see the `[patch]` comment in the workspace
# root Cargo.toml).
# The workspace-root [patch.crates-io] swaps in the locally patched copy.
cyper-core = { version = "0.9", default-features = false, optional = true }
rusqlite = { version = "0.40.1", features = ["bundled"], optional = true }
r2d2 = { version = "0.8", optional = true }
r2d2_sqlite = { version = "0.35.0", optional = true }
serde = { version = "1.0.110", features = ["serde_derive", "rc"] }
serde_json = "1.0.53"
sha1 = { version = "0.11.0", optional = true }
sha2 = { version = "0.11.0", optional = true }
tar = "0.4.46"
time = { version = "0.3.47", features = ["formatting"], optional = true }
# Only the Dragonfly SDK proxy path (`backend/proxy.rs` + the ProxySDK arms in
# `backend/request.rs`) needs a real tokio runtime; the default build runs
# solely on compio. Kept in [dev-dependencies] for the http-proxy test mocks.
tokio = { version = "1.52.3", features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
], optional = true }
url = { version = "2.1.1", optional = true }
vm-memory = { workspace = true }
fuse-backend-rs = { workspace = true }
gpt = { version = "4.1.0", optional = true }

nydus-api = { version = "0.4.1", path = "../api" }
nydus-utils = { version = "0.5.1", path = "../utils", features = [
    "encryption",
    "zran",
] }
once_cell = { version = "1" }
# The `request` module moved out of `dragonfly-client-util` into its own crate at 1.4.0.
# Pinned exactly because the split showed that this API is not covered by semver in
# practice, and a silent minor bump breaks the build (upstream v3 pins it the same way).
dragonfly-client-request = { version = "=1.4.2", optional = true }
rand = { version = "0.10" }

[dev-dependencies]
criterion = "0.5"
futures = "0.3"
http = "1.4.0"
# The http-proxy test spins up tokio+hyper mock servers (Unix + TCP). These dev
# features were previously pulled in transitively (via hyperlocal / the http
# proxy's own runtime); make them explicit now that the backend itself is on
# compio.
hyper = { version = "1.8.1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.19", features = ["server"] }
vmm-sys-util = { workspace = true }
tar = "0.4.46"
regex = "1.7.0"
toml = "1.1.2"
tokio = { version = "1.52.3", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "time",
] }

[[bench]]
name = "backend_read"
harness = false
required-features = ["backend-s3"]

[features]
backend-localdisk = []
backend-localdisk-gpt = ["gpt", "backend-localdisk"]
backend-localfs = []
backend-oss = [
    "base64",
    "cyper",
    "http",
    "httpdate",
    "hmac",
    "sha1",
    "url",
    "rustls",
    "rustls-platform-verifier",
]
backend-registry = [
    "base64",
    "cyper",
    "http",
    "url",
    "rustls",
    "rustls-platform-verifier",
]
# Opt-in HTTP/3 (QUIC) for the cyper-based backends. OFF by default: cyper's
# h3 pool wedges an origin after a failed/hung QUIC connect and Alt-Svc makes
# the upgrade automatic — see the cyper dependency comment above and
# the "cyper HTTP/3 pool wedge" note above. Enable only against registries whose
# h3 endpoint you trust once the upstream pool fix lands.
backend-http3 = ["cyper/http3", "cyper/http3-altsvc"]
backend-s3 = [
    "base64",
    "cyper",
    "hmac",
    "http",
    "sha2",
    "time",
    "url",
    "rustls",
    "rustls-platform-verifier",
]
backend-http-proxy = [
    "cyper",
    "cyper-core",
    "hyper",
    "http",
    "http-body-util",
    "url",
    "rustls",
    "rustls-platform-verifier",
]
dedup = ["rusqlite", "r2d2", "r2d2_sqlite"]

backend-dragonfly-proxy = [
    "cyper",
    "dep:tokio",
    "dragonfly-client-request",
    "http",
    "url",
]

[package.metadata.docs.rs]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]
