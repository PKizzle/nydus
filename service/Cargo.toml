[package]
name = "nydus-service"
version = "0.4.0"
description = "Nydus Image Service Manager"
authors = ["The Nydus Developers"]
license = "Apache-2.0"
homepage = "https://nydus.dev/"
repository = "https://github.com/dragonflyoss/nydus"
edition = "2024"

[dependencies]
bytes = { version = "1", optional = true }
dbs-allocator = { version = "0.1.1", optional = true }
flume = "0.12"
fuse-backend-rs = { workspace = true, features = ["persist"] }
libc = "0.2"
log = "0.4.8"
mio = { version = "1.2", features = ["os-poll", "os-ext"] }
nix = "0.31.3"
rust-fsm = "0.8.0"
sendfd = "0.4"
serde = { version = "1.0.110", features = ["serde_derive", "rc"] }
serde_json = "1.0.51"
serde_repr = "0.1"
thiserror = "2.0.18"
time = { version = "0.3.47", features = ["serde-human-readable"] }
versionize_derive = "0.1.6"
versionize = "0.2.0"

nydus-api = { version = "0.4.1", path = "../api" }
nydus-rafs = { version = "0.4.1", path = "../rafs" }
nydus-storage = { version = "0.7.2", path = "../storage" }
nydus-upgrade = { version = "0.2.0", path = "../upgrade" }
nydus-utils = { version = "0.5.1", path = "../utils" }

vhost = { workspace = true, features = ["vhost-user"], optional = true }
vhost-user-backend = { workspace = true, optional = true }
virtio-bindings = { workspace = true, optional = true }
virtio-queue = { workspace = true, optional = true }
vm-memory = { workspace = true, features = ["backend-mmap"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
compio = { version = "0.19", default-features = false, features = [
    "runtime",
    "io",
    "fs",
    "net",
    "io-uring",
    "polling",
    "time",
] }
# Block-device event loops (uffd/nbd) replace tokio's select!/broadcast/time
# with compio's reactor plus these runtime-agnostic helpers.
async-broadcast = "0.7"
futures-util = "0.3"

[dev-dependencies]
vmm-sys-util = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
procfs = "0.18.0"

[features]
default = ["fuse-backend-rs/fusedev"]
virtiofs = [
    "fuse-backend-rs/vhost-user-fs",
    "vm-memory",
    "vhost",
    "vhost-user-backend",
    "virtio-queue",
    "virtio-bindings",
]

block-device = ["dbs-allocator"]
block-nbd = ["block-device", "bytes"]
block-uffd = ["block-device"]

coco = ["fuse-backend-rs/fusedev", "nydus-storage/backend-registry"]
