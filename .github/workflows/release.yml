name: Release

on:
  push:
    tags:
     - v[0-9]+.[0-9]+.[0-9]+*
  schedule:
    # Run daily sanity check at 22:08 clock UTC
    - cron: "8 22 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  nydus-linux:
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-latest' }}
    strategy:
      matrix:
        arch: [amd64, arm64, ppc64le, riscv64]
    steps:
    - uses: actions/checkout@v6
    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true
        shared-key: ${{ runner.os }}-cargo-${{ matrix.arch }}
    - uses: dsherret/rust-toolchain-file@v1
    - name: Read Rust toolchain version
      id: set_toolchain_version
      run: |
        RUST_TOOLCHAIN_VERSION=$(grep -oP '(?<=channel = ")[^"]*' rust-toolchain.toml)
        echo "Rust toolchain version: $RUST_TOOLCHAIN_VERSION"
        echo "rust-version=$RUST_TOOLCHAIN_VERSION" >> $GITHUB_OUTPUT
      shell: bash
    - name: Set up Docker Buildx
      if: matrix.arch == 'riscv64'
      uses: docker/setup-buildx-action@v3
    - name: Build and push Docker image
      if: matrix.arch == 'riscv64'
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./.github/workflows/Dockerfile.cross
        push: false
        load: true
        tags: rust-cross-compile-riscv64:latest
        build-args: |
          RUST_VERSION=${{ steps.set_toolchain_version.outputs.rust-version }}
    - name: Build nydus-rs Non-RISC-V
      if: matrix.arch != 'riscv64'
      run: |
        declare -A rust_target_map=( ["amd64"]="x86_64-unknown-linux-musl" ["arm64"]="aarch64-unknown-linux-musl" ["ppc64le"]="powerpc64le-unknown-linux-gnu")
        RUST_TARGET=${rust_target_map[${{ matrix.arch }}]}
        cargo install --locked --version 0.2.5 cross
        make -e RUST_TARGET_STATIC=$RUST_TARGET -e CARGO=cross static-release
    - name : Build Nydus-rs RISC-V
      if: matrix.arch == 'riscv64'
      run: |
        RUST_TARGET=riscv64gc-unknown-linux-gnu
        docker run --rm -v ${{ github.workspace }}:/root/src rust-cross-compile-riscv64:latest \
        sh -c "cd /root/src && make -e RUST_TARGET_STATIC=$RUST_TARGET static-release"
    - name: Prepare to upload artifacts
      run: |
        declare -A rust_target_map=( ["amd64"]="x86_64-unknown-linux-musl" ["arm64"]="aarch64-unknown-linux-musl" ["ppc64le"]="powerpc64le-unknown-linux-gnu" ["riscv64"]="riscv64gc-unknown-linux-gnu")
        RUST_TARGET=${rust_target_map[${{ matrix.arch }}]}
        # Stage into a directory of its own rather than the repo root, where
        # binary names collide with source directories: `nydusify/` is a crate,
        # so `mv target/$RUST_TARGET/release/nydusify .` fails outright with
        # "cannot overwrite directory './nydusify' with non-directory".
        stage=release-artifacts
        mkdir -p "$stage"
        for b in nydusd nydus-image nydusctl nydusify; do
          sudo mv "target/$RUST_TARGET/release/$b" "$stage/$b"
        done
        # Snapshotter binaries (built by `make static-release` --workspace):
        # containerd-nydus is the product; nydus-migrate carries the manual
        # reconcile-snapshots/repair-labels subcommands operators need;
        # nydus-credential-bridge is its deployment companion. Guarded so a
        # target that ever drops one of them degrades the tarball, not the
        # release.
        for b in containerd-nydus nydus-migrate nydus-credential-bridge; do
          [ -f "target/$RUST_TARGET/release/$b" ] && sudo mv "target/$RUST_TARGET/release/$b" "$stage/$b" || true
        done
        sudo cp -r misc/configs "$stage/"
        sudo chown -R $(id -un):$(id -gn) "$stage" ~/.cargo/
    - name: store-artifacts
      uses: actions/upload-artifact@v6
      with:
        name: nydus-artifacts-linux-${{ matrix.arch }}
        # The glob's least-common-ancestor is the staging dir, so entries land
        # at the artifact root exactly as they did when they were collected in
        # the repo root -- prepare-tarball-linux still gets nydus-static/<bin>.
        path: release-artifacts/*

  nydus-macos:
    runs-on: macos-15
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
    - uses: actions/checkout@v6
    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true
        shared-key: ${{ runner.os }}-cargo-${{ matrix.arch }}
    - uses: dsherret/rust-toolchain-file@v1
    - name: Install protoc
      run: bash misc/install-protoc.sh
    - name: build
      run: |
        if [[ "${{matrix.arch}}" == "amd64" ]]; then
          RUST_TARGET="x86_64-apple-darwin"
        else
          RUST_TARGET="aarch64-apple-darwin"
        fi
        rustup target add ${RUST_TARGET}
        make -e RUST_TARGET_STATIC=$RUST_TARGET static-release
        sudo mv target/$RUST_TARGET/release/nydusd .
        sudo mv target/$RUST_TARGET/release/nydusctl .
        sudo cp -r misc/configs .
        sudo chown -R $(id -un):$(id -gn) . ~/.cargo/
    - name: store-artifacts
      uses: actions/upload-artifact@v6
      with:
        name: nydus-artifacts-darwin-${{ matrix.arch }}
        path: |
          nydusctl
          nydusd
          configs

  prepare-tarball-linux:
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-latest' }}
    strategy:
      matrix:
        arch: [amd64, arm64, ppc64le, riscv64]
        os: [linux]
    needs: [nydus-linux]
    steps:
    - name: download artifacts
      uses: actions/download-artifact@v7
      with:
        pattern: nydus-artifacts-${{ matrix.os }}-${{ matrix.arch }}*
        merge-multiple: true
        path: nydus-static
    - name: prepare release tarball
      run: |
        tag=$(echo $GITHUB_REF | cut -d/ -f3-)
        tarball="nydus-static-$tag-${{ matrix.os }}-${{ matrix.arch }}.tgz"
        chmod +x nydus-static/*
        tar cf - nydus-static | gzip > ${tarball}
        echo "tarball=${tarball}" >> $GITHUB_ENV

        shasum="$tarball.sha256sum"
        sha256sum $tarball > $shasum
        echo "tarball_shasum=${shasum}" >> $GITHUB_ENV
    - name: store-artifacts
      uses: actions/upload-artifact@v6
      with:
        name: nydus-release-tarball-${{ matrix.os }}-${{ matrix.arch }}
        path: |
          ${{ env.tarball }}
          ${{ env.tarball_shasum }}

  # use a seperate job for darwin because github action if: condition cannot handle && properly.
  prepare-tarball-darwin:
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-latest' }}
    strategy:
      matrix:
        arch: [amd64, arm64]
        os: [darwin]
    needs: [nydus-macos]
    steps:
    - name: download artifacts
      uses: actions/download-artifact@v7
      with:
        name: nydus-artifacts-${{ matrix.os }}-${{ matrix.arch }}
        path: nydus-static
    - name: prepare release tarball
      run: |
        tag=$(echo $GITHUB_REF | cut -d/ -f3-)
        tarball="nydus-static-$tag-${{ matrix.os }}-${{ matrix.arch }}.tgz"
        chmod +x nydus-static/*
        tar cf - nydus-static | gzip > ${tarball}
        echo "tarball=${tarball}" >> $GITHUB_ENV

        shasum="$tarball.sha256sum"
        sha256sum $tarball > $shasum
        echo "tarball_shasum=${shasum}" >> $GITHUB_ENV
    - name: store-artifacts
      uses: actions/upload-artifact@v6
      with:
        name: nydus-release-tarball-${{ matrix.os }}-${{ matrix.arch }}
        path: |
          ${{ env.tarball }}
          ${{ env.tarball_shasum }}

  create-release:
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-latest' }}
    needs: [prepare-tarball-linux, prepare-tarball-darwin]
    # The repository default for GITHUB_TOKEN is read-only, so a job that
    # creates a release has to ask for write explicitly -- without this the
    # tarballs build fine and the upload dies with a bare "403 / Too many
    # retries", which reads like a flaky network rather than a permission.
    # `goreleaser` and `provenance` below already declare it; this job was the
    # one that did not, which is why v3.0.0 built completely and published
    # nothing.
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v6
      with:
        # The release notes are built from the range between this tag and the
        # previous one, which a shallow checkout does not contain.
        fetch-depth: 0
    - name: sanity-check snapshotter version against tag
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        # Non-blocking: `containerd-nydus --version` reports the snapshotter
        # crate version, which should track the release tag's major.minor.
        tag="${GITHUB_REF#refs/*/}"
        crate=$(grep -m1 '^version' snapshotter/Cargo.toml | cut -d'"' -f2)
        if [ "${tag#v}" != "$crate" ]; then
          echo "::warning::snapshotter crate version ($crate) does not match release tag (${tag#v}); consider bumping snapshotter/Cargo.toml"
        fi
    - name: download artifacts
      uses: actions/download-artifact@v7
      with:
        pattern: nydus-release-tarball-*
        merge-multiple: true
        path: nydus-tarball
    - name: prepare release env
      run: |
        echo "tarballs<<EOF" >> $GITHUB_ENV
        for I in $(ls nydus-tarball);do echo "nydus-tarball/${I}" >> $GITHUB_ENV; done
        echo "EOF" >> $GITHUB_ENV
        tag=$(echo $GITHUB_REF | cut -d/ -f3-)
        echo "tag=${tag}" >> $GITHUB_ENV

        # Release notes: what the tagger wrote, then what actually changed.
        #
        # GitHub's generated notes list merged pull requests, and this fork
        # commits straight to its branch, so they came out as nothing but a
        # compare link -- which is why v3.0.1 and v3.0.2 shipped without a
        # changelog. The history is right here; it just has to be read.
        prev=$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || echo "")
        {
          echo "notes<<NOTES_EOF"
          # An annotated tag's message is the summary written when the release
          # was cut. Its first line repeats the release title, so it is dropped
          # along with the blank line under it.
          # Leading blank line dropped with the subject; trailing ones dropped
          # so the changelog heading below sits one blank line away.
          git tag -l --format='%(contents)' "$tag" | tail -n +2 |
            sed '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;};/\n$/ba'
          if [ -n "$prev" ]; then
            echo
            echo "## Changelog"
            echo
            git log --reverse --pretty='* %s (`%h`)' "${prev}..${tag}"
            echo
            echo "**Full changelog**: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${prev}...${tag}"
          fi
          echo "NOTES_EOF"
        } >> $GITHUB_ENV
        cat $GITHUB_ENV
    - name: push release
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@v1
      with:
        name: "Nydus Image Service ${{ env.tag }}"
        body: ${{ env.notes }}
        # Off: the generated notes are built from merged pull requests, and this
        # fork has none, so they add a compare link and nothing else. The notes
        # above carry that link themselves.
        generate_release_notes: false
        files: |
          ${{ env.tarballs }}


  goreleaser:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        arch: [amd64, arm64]
        os: [linux]
    needs: [nydus-linux]
    permissions:
      contents: write
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-latest' }}
    timeout-minutes: 60
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Golang
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.work'
          cache-dependency-path: "**/*.sum"
      - name: download artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: nydus-artifacts-${{ matrix.os }}-${{ matrix.arch }}*
          merge-multiple: true
          path: nydus-static
      - name: prepare context
        run: |
          chmod +x nydus-static/*
          export GOARCH=${{ matrix.arch }}
          echo "GOARCH: $GOARCH"
          sh ./goreleaser.sh
      - name: Check GoReleaser config
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a
        with:
          version: latest
          args: check

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a
        id: run-goreleaser
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate subject
        id: hash
        env:
          ARTIFACTS: "${{ steps.run-goreleaser.outputs.artifacts }}"
        run: |
          set -euo pipefail
          hashes=$(echo $ARTIFACTS | jq --raw-output '.[] | {name, "digest": (.extra.Digest // .extra.Checksum)} | select(.digest) | {digest} + {name} | join("  ") | sub("^sha256:";"")' | base64 -w0)
          if test "$hashes" = ""; then # goreleaser < v1.13.0
            checksum_file=$(echo "$ARTIFACTS" | jq -r '.[] | select (.type=="Checksum") | .path')
            hashes=$(cat $checksum_file | base64 -w0)
          fi
          echo "hashes=$hashes" >> $GITHUB_OUTPUT

      - name: Set tag output
        id: tag
        run: echo "tag_name=${GITHUB_REF#refs/*/}" >> "$GITHUB_OUTPUT"

  provenance:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [goreleaser]
    permissions:
      actions: read # To read the workflow path.
      id-token: write # To sign the provenance.
      contents: write # To add assets to a release.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.goreleaser.outputs.hashes }}"
      upload-assets: true # upload to a new release
      upload-tag-name: "${{ needs.release.outputs.tag_name }}"
      draft-release: true
