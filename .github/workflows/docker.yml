name: Build and Push Snapshotter Image

# Builds the multi-arch nydus v3 snapshotter image (containerd-nydus + nydus-image) and publishes
# it as ghcr.io/pkizzle/nydus. Each architecture is compiled as fully-static musl binaries on its
# NATIVE runner (amd64 on ubuntu-latest, arm64 on ubuntu-24.04-arm) and copied into a runtime-only
# image (deploy/docker/Dockerfile.release) on that same runner, so there is no QEMU emulation.
# Runs after a GitHub Release is published (the existing release.yml creates the release on tag
# push), or manually against a tag.

on:
  workflow_dispatch:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  # musl-gcc serves whichever target matches the native runner; the unused var is ignored.
  CC_x86_64_unknown_linux_musl: musl-gcc
  CC_aarch64_unknown_linux_musl: musl-gcc
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - uses: dsherret/rust-toolchain-file@v1

      - name: Install protoc
        run: bash misc/install-protoc.sh

      - name: Add musl target
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: image-${{ matrix.target }}

      - name: Build static binaries (containerd-nydus, nydus-image)
        run: |
          cargo build --release --target ${{ matrix.target }} \
            -p nydus-snapshotter --bin containerd-nydus
          cargo build --release --target ${{ matrix.target }} \
            --bin nydus-image

      - name: Stage binaries for image build
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/containerd-nydus" dist/
          cp "target/${{ matrix.target }}/release/nydus-image" dist/
          chmod +x dist/*

      - name: Convert repository name to lowercase
        id: image_name
        uses: ASzc/change-string-case-action@v6
        with:
          string: ${{ github.repository }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image_name.outputs.lowercase }}
          # Suffix tags with architecture for per-arch pulls; the manifest job joins them.
          flavor: |
            suffix=-${{ matrix.arch }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          # Build context is the tiny staging dir; the runtime Dockerfile only COPYs the binaries.
          context: dist
          file: deploy/docker/Dockerfile.release
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          platforms: ${{ matrix.platform }}
          provenance: false

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Create the multi-arch manifest (ghcr.io/pkizzle/nydus) after all platform builds complete.
  manifest:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Convert repository name to lowercase
        id: image_name
        uses: ASzc/change-string-case-action@v6
        with:
          string: ${{ github.repository }}

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for manifest
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image_name.outputs.lowercase }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}

      - name: Create and push manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ steps.image_name.outputs.lowercase }}@sha256:%s ' *)

      - name: Image summary
        run: |
          echo "## Snapshotter images" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.tags[] | "- `" + . + "`"' <<< "$DOCKER_METADATA_OUTPUT_JSON" >> "$GITHUB_STEP_SUMMARY"
