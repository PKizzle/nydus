name: Convert & Check Images

on:
  schedule:
    # Do conversion every day at 00:03 clock UTC
    - cron: "3 0 * * *"
  workflow_dispatch:

# The conversion jobs push converted images to ghcr.io. The repository default for
# GITHUB_TOKEN is read-only, so without this the pushes fail with
# `DENIED: installation not allowed to Create organization package`.
permissions:
  contents: read
  packages: write

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  # ghcr rejects uppercase repository names, and a fork's owner need not be
  # lowercase (this one is not). Expression syntax has no lowercase function, so
  # each job that pushes derives it with ${GITHUB_REPOSITORY,,} instead.
  IMAGE_LIST_PATH: misc/top_images/image_list.txt
  FSCK_PATCH_PATH: misc/top_images/fsck.patch

jobs:
  nydusify-build:
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-latest' }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true
        shared-key: Linux-cargo-amd64
    - uses: dsherret/rust-toolchain-file@v1
    - name: Install protoc
      run: bash misc/install-protoc.sh
    - name: Build Nydusify
      run: make nydusify-release
    - name: Upload Nydusify
      uses: actions/upload-artifact@v6
      with:
        name: nydusify-artifact
        path: target/release/nydusify

  nydus-build:
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-latest' }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true
        shared-key: Linux-cargo-amd64
    - uses: dsherret/rust-toolchain-file@v1
    - name: Install protoc
      run: bash misc/install-protoc.sh
    - name: Build Nydus
      run: |
        make release
    - name: Upload Nydus Binaries
      uses: actions/upload-artifact@v6
      with:
        name: nydus-artifact
        path: |
          target/release/nydus-image
          target/release/nydusd

  fsck-erofs-build:
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Build fsck.erofs
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential git autotools-dev automake libtool pkg-config uuid-dev liblz4-dev
          git clone https://git.kernel.org/pub/scm/linux/kernel/git/xiang/erofs-utils.git
          cd erofs-utils && git checkout v1.6 && git apply ../${{ env.FSCK_PATCH_PATH }} && ./autogen.sh && ./configure && make && cd ..
          sudo cp erofs-utils/fsck/fsck.erofs /usr/local/bin/
      - name: Upload fsck.erofs
        uses: actions/upload-artifact@v6
        with:
          name: fsck-erofs-artifact
          path: |
            /usr/local/bin/fsck.erofs

  convert-zran:
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-latest' }}
    needs: [nydusify-build, nydus-build, fsck-erofs-build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Login ghcr registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download Nydus
        uses: actions/download-artifact@v7
        with:
          name: nydus-artifact
          path: /usr/local/bin
      - name: Download Nydusify
        uses: actions/download-artifact@v7
        with:
          name: nydusify-artifact
          path: /usr/local/bin
      - name: Download fsck.erofs
        uses: actions/download-artifact@v7
        with:
          name: fsck-erofs-artifact
          path: /usr/local/bin
      - name: Convert and check zran images
        run: |
          sudo chmod +x /usr/local/bin/nydus*
          sudo chmod +x /usr/local/bin/fsck.erofs
          sudo docker run -d --restart=always -p 5000:5000 registry
          sudo mkdir convert-zran
          for I in $(cat ${{ env.IMAGE_LIST_PATH }}); do
            # skip influxdb which have some issue to convert use zran
            if [ "$I" = "influxdb" ]; then
              echo "skip influxdb image for zran conversion"
              continue
            fi
            echo "converting $I:latest to $I:nydus-nightly-oci-ref"
            ghcr_repo=${{ env.REGISTRY }}/${GITHUB_REPOSITORY,,}

            # push oci image to ghcr/local for zran reference
            sudo docker pull $I:latest
            sudo docker tag $I:latest $ghcr_repo/$I
            sudo docker tag $I:latest localhost:5000/$I
            sudo DOCKER_CONFIG=$HOME/.docker docker push $ghcr_repo/$I
            sudo docker push localhost:5000/$I

            # for pre-built images
            sudo DOCKER_CONFIG=$HOME/.docker nydusify convert \
                 --oci-ref \
                 --source $ghcr_repo/$I \
                 --target $ghcr_repo/$I:nydus-nightly-oci-ref \
                 --platform linux/amd64

            # use local registry for speed
            sudo DOCKER_CONFIG=$HOME/.docker nydusify convert \
                 --oci-ref \
                 --source localhost:5000/$I \
                 --target localhost:5000/$I:nydus-nightly-oci-ref \
                 --plain-http \
                 --platform linux/amd64 \
                 --output-json convert-zran/${I}.json

            # check zran image and referenced oci image
            sudo rm -rf ./tmp
            sudo DOCKER_CONFIG=$HOME/.docker nydusify check \
                --source localhost:5000/$I \
                --target localhost:5000/$I:nydus-nightly-oci-ref \
                --plain-http

            sudo fsck.erofs -d1 ./output/target/nydus_bootstrap/image/image.boot
            sudo rm -rf ./output
          done
      - name: Save Nydusify Metric
        uses: actions/upload-artifact@v6
        with:
          name: convert-zran-metric
          path: convert-zran

  convert-native-v6:
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-latest' }}
    needs: [nydusify-build, nydus-build, fsck-erofs-build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Login ghcr registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download Nydus
        uses: actions/download-artifact@v7
        with:
          name: nydus-artifact
          path: /usr/local/bin
      - name: Download Nydusify
        uses: actions/download-artifact@v7
        with:
          name: nydusify-artifact
          path: /usr/local/bin
      - name: Download fsck.erofs
        uses: actions/download-artifact@v7
        with:
          name: fsck-erofs-artifact
          path: /usr/local/bin
      - name: Convert and check RAFS v6 images
        run: |
          sudo chmod +x /usr/local/bin/nydus*
          sudo chmod +x /usr/local/bin/fsck.erofs
          sudo docker run -d --restart=always -p 5000:5000 registry
          sudo mkdir convert-native-v6
          for I in $(cat ${{ env.IMAGE_LIST_PATH }}); do
            echo "converting $I:latest to $I:nydus-nightly-v6"
            # for pre-built images
            sudo DOCKER_CONFIG=$HOME/.docker nydusify convert \
                 --source $I:latest \
                 --target ${{ env.REGISTRY }}/${GITHUB_REPOSITORY,,}/$I:nydus-nightly-v6 \
                 --fs-version 6 \
                 --platform linux/amd64

            # use local registry for speed
            sudo DOCKER_CONFIG=$HOME/.docker nydusify convert \
                 --source $I:latest \
                 --target localhost:5000/$I:nydus-nightly-v6 \
                 --target-plain-http \
                 --fs-version 6 \
                 --platform linux/amd64 \
                 --output-json convert-native-v6/${I}.json

            # Assert the Go-parity metric fields are present and non-zero.
            jq -e '.SourceImageSize > 0 and .TargetImageSize > 0 and (.ConversionElapsed | test("^[0-9]"))' \
                convert-native-v6/${I}.json

            sudo rm -rf ./tmp
            sudo DOCKER_CONFIG=$HOME/.docker nydusify check --source $I:latest \
                --target localhost:5000/$I:nydus-nightly-v6 \
                --target-plain-http

            sudo fsck.erofs -d1 ./output/target/nydus_bootstrap/image/image.boot
            sudo rm -rf ./output
          done
      - name: Save Nydusify Metric
        uses: actions/upload-artifact@v6
        with:
          name: convert-native-v6-metric
          path: convert-native-v6

  convert-multiarch:
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-latest' }}
    needs: [nydusify-build, nydus-build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Download Nydus
        uses: actions/download-artifact@v7
        with:
          name: nydus-artifact
          path: /usr/local/bin
      - name: Download Nydusify
        uses: actions/download-artifact@v7
        with:
          name: nydusify-artifact
          path: /usr/local/bin
      - name: Convert a multi-arch source and verify the pushed index
        run: |
          sudo chmod +x /usr/local/bin/nydus*
          sudo docker run -d --restart=always -p 5000:5000 registry
          sudo mkdir convert-multiarch
          # busybox is a small, stable multi-arch source. --all-platforms +
          # --merge-platform must publish one OCI image index whose manifests
          # carry per-platform fields.
          SRC=docker.io/library/busybox:1.36
          TGT=localhost:5000/busybox:nydus-multiarch
          sudo DOCKER_CONFIG=$HOME/.docker nydusify convert \
               --source $SRC \
               --target $TGT \
               --target-plain-http \
               --fs-version 6 \
               --all-platforms \
               --merge-platform \
               --output-json convert-multiarch/busybox.json

          # Two-platform comma list against the same source must also succeed.
          sudo DOCKER_CONFIG=$HOME/.docker nydusify convert \
               --source $SRC \
               --target localhost:5000/busybox:nydus-multiarch-list \
               --target-plain-http \
               --fs-version 6 \
               --platform linux/amd64,linux/arm64 \
               --merge-platform

          # The target must be an image index / manifest list with >1 manifest.
          MT=$(curl -s -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
               localhost:5000/v2/busybox/manifests/nydus-multiarch | jq -r '.mediaType // .manifests[0].mediaType')
          COUNT=$(curl -s -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
               localhost:5000/v2/busybox/manifests/nydus-multiarch | jq '.manifests | length')
          echo "pushed target mediaType=$MT manifests=$COUNT"
          test "$COUNT" -gt 1
          jq -e '.platforms | length > 1' convert-multiarch/busybox.json
      - name: Save Nydusify Metric
        uses: actions/upload-artifact@v6
        with:
          name: convert-multiarch-metric
          path: convert-multiarch
